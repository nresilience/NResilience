name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Behaviour, then the hard allocation gate. Both in one job because both want the same
  # Release build of the same solution.
  #
  # Release only. The budgets were measured against tier-1 code, and a Debug run measures
  # something else entirely: it would fail loudly rather than pass falsely, but the failure
  # would be meaningless. Both target TFMs run, because "no cliff on net8" is a claim.
  gates:
    name: Tests and allocation gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet restore NResilience.slnx

      - run: dotnet build NResilience.slnx -c Release --no-restore

      - name: Run the behavioural suite
        run: dotnet test tests/NResilience.Tests/NResilience.Tests.csproj -c Release --no-build

      - name: Run gates
        run: dotnet test tests/NResilience.Gates/NResilience.Gates.csproj -c Release --no-build -- --output detailed

      # The analyzers ship inside the package, so a false positive is a build break in every
      # consumer's project. The suite compiles consumer-shaped snippets and asserts the exact set
      # of diagnostics each one raises - including the snippets that must raise none.
      - name: Run the analyzer suite
        run: dotnet test tests/NResilience.Analyzers.Tests/NResilience.Analyzers.Tests.csproj -c Release --no-build

  # Docs gate.
  #
  # Every snippet in the README and under docs/ lives in tests/NResilience.Docs as compiled,
  # executing code, and is inlined into the markdown by tools/NResilience.DocSnippets. The test run
  # proves the samples still work; the check run proves the pages still show what the samples say.
  # Given that the most-copied .NET retry snippet is on Microsoft Learn and is actively harmful,
  # this is a correctness gate rather than tidiness.
  docs:
    name: Docs gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run the documentation snippets
        run: dotnet test tests/NResilience.Docs/NResilience.Docs.csproj -c Release

      - name: Check the pages against them
        run: dotnet run --project tools/NResilience.DocSnippets -c Release -- --check

      - name: Build and run the samples
        run: |
          for sample in samples/*/; do
            dotnet run --project "$sample" -c Release
          done

  # Hard gate - Native AOT.
  #
  # Publishing without warnings proves the code is AOT-clean; running the published binary
  # proves there is no AOT allocation cliff, which is the claim actually worth defending.
  aot:
    name: Native AOT (${{ matrix.os }}, ${{ matrix.tfm }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        tfm: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install the native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish
        run: dotnet publish tests/NResilience.AotProbe/NResilience.AotProbe.csproj -c Release -f ${{ matrix.tfm }} -warnaserror

      - name: Execute the published binary
        shell: bash
        run: |
          binary=$(find tests/NResilience.AotProbe/bin/Release/${{ matrix.tfm }} -type f \
                     \( -name 'NResilience.AotProbe' -o -name 'NResilience.AotProbe.exe' \) \
                     -path '*/publish/*' ! -ipath '*.dsym/*' | head -1)
          if [ -z "$binary" ]; then
            echo "No published binary found - the AOT gate cannot pass without one." >&2
            exit 1
          fi
          "$binary"
